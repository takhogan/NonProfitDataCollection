## Top-level nginx config for the Cloud Run container.
## The server block comes from deploy/nginx.conf.template (rendered to
## /etc/nginx/conf.d/default.conf by the official image's envsubst entrypoint).

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Cloud Run terminates TLS; log to stdout/stderr so logs reach Cloud Logging.
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  # Writable temp paths (helps if the container runs read-only / non-root).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # gzip for text assets.
  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml application/manifest+json;

  include /etc/nginx/conf.d/*.conf;
}
