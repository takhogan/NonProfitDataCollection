[project]
name = "dashboard-api"
version = "0.1.0"
description = "Dashboard API serving the web dashboard (reads shared DB written by whatsapp/api)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",   # Postgres driver (shared DB in production)
    # Password hashing shared with whatsapp/api (same scheme).
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    # AI campaign-field suggestions (Structured Outputs). Optional at runtime:
    # with no OPENAI_API_KEY the suggest endpoint falls back to template defaults.
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dash*"]
