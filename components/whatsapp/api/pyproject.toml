[project]
name = "aid-coordination-api"
version = "0.1.0"
description = "Authenticated application API and inbound webhooks for the aid coordination platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7 reads bcrypt.__about__, removed in bcrypt>=4.1
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",  # Postgres driver, used in production via DATABASE_URL
    "geoalchemy2>=0.14",  # PostGIS column types (pilot schema)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
